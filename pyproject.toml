[project]
name = "focusflow"
version = "0.1.0"
description = "Personal routine, habit, and productivity web app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.2",
    "psycopg[binary]>=3.1.18",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "django-environ>=0.11.2",
    "djangorestframework>=3.15.1",
    "whitenoise>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-django>=4.8.0",
    "ruff>=0.3.4",
]