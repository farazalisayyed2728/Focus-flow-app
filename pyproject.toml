[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focusflow"
version = "0.1.0"
description = "FocusFlow Django application"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.1,<6.0",
    "celery[redis]>=5.4,<6.0",
    "psycopg[binary]>=3.2,<4.0",
]

[tool.setuptools.packages.find]
include = ["config*", "apps*"]
