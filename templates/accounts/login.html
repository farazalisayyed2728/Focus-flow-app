{% extends "base.html" %}

{% block title %}Log In — FocusFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-16">
    <div class="card space-y-6">
        <div>
            <h1 class="text-2xl font-black tracking-tight" style="color: var(--text);">Welcome back</h1>
            <p style="color: var(--text-muted);" class="text-xs mt-1">Sign in to your FocusFlow command center.</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1" style="color: var(--text-muted);">Username</label>
                <input type="text" name="username" class="input" required autofocus placeholder="Enter your username">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1" style="color: var(--text-muted);">Password</label>
                <input type="password" name="password" class="input" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary w-full py-3 mt-4 text-sm font-bold">
                Log In
            </button>
        </form>

        <p class="text-xs text-center" style="color: var(--text-muted);">
            Don't have an account? <a href="{% url 'signup' %}" class="font-bold underline" style="color: var(--accent);">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
