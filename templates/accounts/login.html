{% extends "base.html" %}

{% block title %}Log In — FocusFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="card space-y-6">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">Welcome back</h1>
            <p style="color: var(--text-muted);" class="text-sm">Sign in to your FocusFlow command center.</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium mb-1">Username</label>
                <input type="text" name="username" class="input" required autofocus>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" name="password" class="input" required>
            </div>

            <button type="submit" class="btn btn-primary w-full mt-4">Log In</button>
        </form>

        <p class="text-xs text-center" style="color: var(--text-muted);">
            Don't have an account? <a href="{% url 'signup' %}" class="underline font-semibold" style="color: var(--accent);">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
