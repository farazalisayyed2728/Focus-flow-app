<div class="card space-y-4" x-data="{
    modes: { focus: 25 * 60, short: 5 * 60, long: 15 * 60 },
    currentMode: 'focus',
    timeLeft: 25 * 60,
    isRunning: false,
    timer: null,
    setMode(mode) {
        this.pause();
        this.currentMode = mode;
        this.timeLeft = this.modes[mode];
    },
    toggle() {
        if (this.isRunning) { this.pause(); } else { this.start(); }
    },
    start() {
        this.isRunning = true;
        this.timer = setInterval(() => {
            if (this.timeLeft > 0) {
                this.timeLeft--;
            } else {
                this.pause();
                this.$dispatch('show-toast', { message: 'Focus block finished! Take a break.', type: 'info' });
            }
        }, 1000);
    },
    pause() {
        this.isRunning = false;
        clearInterval(this.timer);
    },
    reset() {
        this.pause();
        this.timeLeft = this.modes[this.currentMode];
    },
    formatTime() {
        const m = Math.floor(this.timeLeft / 60).toString().padStart(2, '0');
        const s = (this.timeLeft % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }
}">
    <div class="flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider" style="color: var(--text-muted);">Tactile Focus Timer</span>
        <div class="flex gap-2">
            <button @click="setMode('focus')" :class="currentMode === 'focus' ? 'btn-primary' : 'btn-secondary'" class="btn text-xs py-1 px-3">Focus</button>
            <button @click="setMode('short')" :class="currentMode === 'short' ? 'btn-primary' : 'btn-secondary'" class="btn text-xs py-1 px-3">Short Break</button>
            <button @click="setMode('long')" :class="currentMode === 'long' ? 'btn-primary' : 'btn-secondary'" class="btn text-xs py-1 px-3">Long Break</button>
        </div>
    </div>

    <!-- Recessed Clock Display Wells (UI 3 Inspired) -->
    <div class="neu-sunken text-center py-6 max-w-xs mx-auto">
        <div class="text-5xl font-black tracking-tight" style="color: var(--text);" x-text="formatTime()">25:00</div>
    </div>

    <div class="flex justify-center gap-4">
        <button @click="toggle()" class="btn btn-primary px-8" x-text="isRunning ? 'Pause' : 'Start Focus'"></button>
        <button @click="reset()" class="btn btn-secondary px-6">Reset</button>
    </div>
</div>
