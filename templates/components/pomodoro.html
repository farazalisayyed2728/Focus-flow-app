<div class="card space-y-4" x-data="pomodoro">
    <div class="flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider" style="color: var(--text-muted);">Tactile Focus Timer</span>
        <div class="flex gap-2">
            <button type="button" @click="setMode('focus')" :class="currentMode === 'focus' ? 'btn-primary' : 'btn-secondary'" class="btn text-xs py-1.5 px-4 font-bold">Focus</button>
            <button type="button" @click="setMode('short')" :class="currentMode === 'short' ? 'btn-primary' : 'btn-secondary'" class="btn text-xs py-1.5 px-4 font-bold">Short Break</button>
            <button type="button" @click="setMode('long')" :class="currentMode === 'long' ? 'btn-primary' : 'btn-secondary'" class="btn text-xs py-1.5 px-4 font-bold">Long Break</button>
        </div>
    </div>

    <!-- Recessed Clock Well -->
    <div class="neu-sunken text-center py-6 max-w-sm mx-auto w-full">
        <div class="text-5xl font-black tracking-tight" style="color: var(--text);" x-text="formatTime()">25:00</div>
    </div>

    <div class="flex justify-center items-center gap-4 pt-1">
        <button type="button" @click="toggle()" class="btn btn-primary min-w-[130px] px-8 py-2.5 text-xs font-bold" x-text="isRunning ? 'Pause' : 'Start Focus'">Start Focus</button>
        <button type="button" @click="reset()" class="btn btn-secondary min-w-[90px] px-6 py-2.5 text-xs font-semibold">Reset</button>
    </div>
</div>
