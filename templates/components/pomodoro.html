<div class="card space-y-3" x-data="{
    modes: { focus: 25 * 60, short: 5 * 60, long: 15 * 60 },
    currentMode: 'focus',
    timeLeft: 25 * 60,
    isRunning: false,
    timer: null,
    setMode(mode) {
        this.pause();
        this.currentMode = mode;
        this.timeLeft = this.modes[mode];
    },
    toggle() {
        if (this.isRunning) { this.pause(); } else { this.start(); }
    },
    start() {
        this.isRunning = true;
        this.timer = setInterval(() => {
            if (this.timeLeft > 0) {
                this.timeLeft--;
            } else {
                this.pause();
                this.$dispatch('show-toast', { message: 'Focus session completed! Take a breath.', type: 'info' });
            }
        }, 1000);
    },
    pause() {
        this.isRunning = false;
        clearInterval(this.timer);
    },
    reset() {
        this.pause();
        this.timeLeft = this.modes[this.currentMode];
    },
    formatTime() {
        const m = Math.floor(this.timeLeft / 60).toString().padStart(2, '0');
        const s = (this.timeLeft % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }
}">
    <div class="flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider" style="color: var(--text-muted);">Focus Timer</span>
        <div class="flex gap-1 text-[11px]">
            <button @click="setMode('focus')" :class="currentMode === 'focus' ? 'pill-accent' : ''" class="pill cursor-pointer">Focus</button>
            <button @click="setMode('short')" :class="currentMode === 'short' ? 'pill-accent' : ''" class="pill cursor-pointer">Short Break</button>
            <button @click="setMode('long')" :class="currentMode === 'long' ? 'pill-accent' : ''" class="pill cursor-pointer">Long Break</button>
        </div>
    </div>

    <div class="text-center py-2">
        <div class="text-4xl font-extrabold tracking-tight" x-text="formatTime()">25:00</div>
    </div>

    <div class="flex justify-center gap-2">
        <button @click="toggle()" class="btn btn-primary text-xs py-1 px-4" x-text="isRunning ? 'Pause' : 'Start'"></button>
        <button @click="reset()" class="btn btn-secondary text-xs py-1 px-3">Reset</button>
    </div>
</div>
