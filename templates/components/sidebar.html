{% if request.user.is_authenticated or show_shell_nav %}
<aside class="desktop-sidebar app-sidebar">
    <div>
        <div class="brand-section">
            <div class="brand-icon-box">F</div>
            <span class="brand-name">FocusFlow</span>
        </div>

        <nav class="sidebar-menu">
            <a href="{% url 'dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <span>📊</span> Dashboard
            </a>
            <a href="{% url 'routine-builder' %}" class="nav-item {% if 'routine' in request.path %}active{% endif %}">
                <span>⏱️</span> Routines
            </a>
            <a href="{% url 'habit-list' %}" class="nav-item {% if 'habit' in request.path %}active{% endif %}">
                <span>🌱</span> Habits
            </a>
            <a href="{% url 'weekly-analytics' %}" class="nav-item {% if 'analytics' in request.path %}active{% endif %}">
                <span>📈</span> Analytics
            </a>
            <a href="{% url 'settings' %}" class="nav-item {% if 'settings' in request.path %}active{% endif %}">
                <span>⚙️</span> Settings
            </a>
        </nav>
    </div>

    <!-- Bottom Promo Banner Card -->
    <div class="sidebar-cta-card">
        <div class="sidebar-cta-title">FocusFlow Mobile Ready</div>
        <div class="sidebar-cta-sub">Install via Chrome PWA on mobile</div>
        <a href="{% url 'settings' %}" class="sidebar-cta-btn">Install App</a>
    </div>
</aside>

<div class="relative" x-data="notificationTray">
  <button @click="toggleTray()"
          hx-get="{% url 'notification-tray' %}" 
          hx-target="#tray-dropdown"
          class="flex items-center justify-between w-full px-3 py-2 rounded-lg text-sm font-medium hover:bg-stone-100" 
          style="color: var(--text);">
    <div class="flex items-center gap-2">
    
      <span id="notif-badge" hx-get="{% url 'notification-unread-count' %}" hx-trigger="load" hx-swap="outerHTML"></span>
    </div>
  </button>

  <div id="tray-dropdown" 
       x-show="openTray" 
       @click.away="closeTray()"
       x-cloak 
       class="absolute left-0 bottom-12 w-64 card shadow-xl z-50 p-0 overflow-hidden">
  </div>
</div>
{% endif %}
