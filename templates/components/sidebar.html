{% if request.user.is_authenticated or show_shell_nav %}
<aside class="desktop-sidebar sidebar-container">
  <div class="space-y-4">
    <!-- Brand Box -->
    <div class="flex items-center gap-3 p-4 rounded-2xl" style="background: var(--surface); box-shadow: var(--shadow-raised-sm);">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center font-bold text-white text-base shadow-sm" style="background: var(--accent);">
        F
      </div>
      <span class="text-base font-extrabold tracking-tight" style="color: var(--text);">FocusFlow</span>
    </div>

    <!-- Navigation Buttons -->
    <nav class="space-y-3 pt-2">
      <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all" style="background: var(--surface); box-shadow: var(--shadow-raised-sm); color: var(--text);">
        <span>📊</span> Dashboard
      </a>
      <a href="{% url 'routine-builder' %}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all" style="background: var(--surface); box-shadow: var(--shadow-raised-sm); color: var(--text);">
        <span>⏱️</span> Routines
      </a>
      <a href="{% url 'habit-list' %}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all" style="background: var(--surface); box-shadow: var(--shadow-raised-sm); color: var(--text);">
        <span>🌱</span> Habits
      </a>
      <a href="{% url 'weekly-analytics' %}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all" style="background: var(--surface); box-shadow: var(--shadow-raised-sm); color: var(--text);">
        <span>📈</span> Analytics
      </a>
      <a href="{% url 'settings' %}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all" style="background: var(--surface); box-shadow: var(--shadow-raised-sm); color: var(--text);">
        <span>⚙️</span> Settings
      </a>
    </nav>
  </div>
</aside>

<div class="relative" x-data="notificationTray">
  <button @click="toggleTray()"
          hx-get="{% url 'notification-tray' %}" 
          hx-target="#tray-dropdown"
          class="flex items-center justify-between w-full px-3 py-2 rounded-lg text-sm font-medium hover:bg-stone-100" 
          style="color: var(--text);">
    <div class="flex items-center gap-2">
      <span>🔔 Alerts</span>
      <span id="notif-badge" hx-get="{% url 'notification-unread-count' %}" hx-trigger="load" hx-swap="outerHTML"></span>
    </div>
  </button>

  <div id="tray-dropdown" 
       x-show="openTray" 
       @click.away="closeTray()"
       x-cloak 
       class="absolute left-0 bottom-12 w-64 card shadow-xl z-50 p-0 overflow-hidden">
  </div>
</div>
{% endif %}
