{% if request.user.is_authenticated or show_shell_nav %}
<aside class="desktop-sidebar hidden md:flex flex-col w-64 p-6 justify-between select-none" style="background-color: var(--surface); border-right: 1px solid var(--border-subtle);">
  <div class="space-y-8">
    <!-- Brand / Logo Card -->
    <div class="flex items-center gap-3 p-3 rounded-2xl" style="box-shadow: var(--shadow-raised-sm);">
      <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-white shadow-sm" style="background: var(--accent);">
        F
      </div>
      <span class="text-lg font-bold tracking-tight">FocusFlow</span>
    </div>

    <!-- Nav List -->
    <nav class="space-y-3">
      <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all" style="box-shadow: var(--shadow-raised-sm); color: var(--text);">
        <span>📊</span> Dashboard
      </a>
      <a href="{% url 'routine-builder' %}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all" style="box-shadow: var(--shadow-raised-sm); color: var(--text);">
        <span>⏱️</span> Routines
      </a>
      <a href="{% url 'habit-list' %}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all" style="box-shadow: var(--shadow-raised-sm); color: var(--text);">
        <span>🌱</span> Habits
      </a>
      <a href="{% url 'weekly-analytics' %}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all" style="box-shadow: var(--shadow-raised-sm); color: var(--text);">
        <span>📈</span> Analytics
      </a>
      <a href="{% url 'settings' %}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all" style="box-shadow: var(--shadow-raised-sm); color: var(--text);">
        <span>⚙️</span> Settings
      </a>
    </nav>
  </div>

  <div class="space-y-4 pt-4">
    <!-- Alerts Drawer Toggle -->
    <div class="relative" x-data="{ openTray: false }">
      <button @click="openTray = !openTray" 
              hx-get="{% url 'notification-tray' %}" 
              hx-target="#tray-dropdown"
              class="flex items-center justify-between w-full px-4 py-3 rounded-2xl text-xs font-semibold cursor-pointer"
              style="box-shadow: var(--shadow-raised-sm); color: var(--text);">
        <div class="flex items-center gap-2">
          <span>🔔 Alerts</span>
          {% if request.user.is_authenticated %}
            <span id="notif-badge" hx-get="{% url 'notification-unread-count' %}" hx-swap="outerHTML"></span>
          {% endif %}
        </div>
      </button>

      <div id="tray-dropdown" 
           x-show="openTray" 
           @click.away="openTray = false" 
           x-cloak 
           class="absolute left-0 bottom-14 w-64 card p-0 overflow-hidden z-50">
      </div>
    </div>

    <!-- Theme Mode Toggle -->
    <button @click="toggleTheme()" class="btn btn-secondary w-full text-xs">
      Toggle Light / Dark
    </button>
  </div>
</aside>

<div class="relative" x-data="{ openTray: false }">
  <button @click="openTray = !openTray" 
          hx-get="{% url 'notification-tray' %}" 
          hx-target="#tray-dropdown"
          class="flex items-center justify-between w-full px-3 py-2 rounded-lg text-sm font-medium hover:bg-stone-100" 
          style="color: var(--text);">
    <div class="flex items-center gap-2">
      <span>🔔 Alerts</span>
      <span id="notif-badge" hx-get="{% url 'notification-unread-count' %}" hx-trigger="load" hx-swap="outerHTML"></span>
    </div>
  </button>

  <div id="tray-dropdown" 
       x-show="openTray" 
       @click.away="openTray = false" 
       x-cloak 
       class="absolute left-0 bottom-12 w-64 card shadow-xl z-50 p-0 overflow-hidden">
  </div>
</div>
{% endif %}
