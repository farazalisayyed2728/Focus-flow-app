{% if request.user.is_authenticated or show_shell_nav %}
<aside class="desktop-sidebar sidebar-container">
  <div class="sidebar-top">
    <!-- Brand -->
    <div class="brand-card">
      <div class="brand-icon">F</div>
      <span class="brand-name">FocusFlow</span>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-nav">
      <a href="{% url 'dashboard' %}" class="sidebar-link">
        <span class="link-icon">📊</span> Dashboard
      </a>
      <a href="{% url 'routine-builder' %}" class="sidebar-link">
        <span class="link-icon">⏱️</span> Routines
      </a>
      <a href="{% url 'habit-list' %}" class="sidebar-link">
        <span class="link-icon">🌱</span> Habits
      </a>
      <a href="{% url 'weekly-analytics' %}" class="sidebar-link">
        <span class="link-icon">📈</span> Analytics
      </a>
      <a href="{% url 'settings' %}" class="sidebar-link">
        <span class="link-icon">⚙️</span> Settings
      </a>
    </nav>
  </div>

  <!-- Pinned Bottom Controls (Always visible, no scrolling needed) -->
  <div class="sidebar-bottom">
    <div class="relative" x-data="{ openTray: false }">
      <button type="button"
              @click="openTray = !openTray" 
              hx-get="{% url 'notification-tray' %}" 
              hx-target="#sidebar-tray-dropdown"
              class="sidebar-control-btn">
        <div class="control-label">
          <span>🔔 Alerts</span>
          <span id="notif-badge" hx-get="{% url 'notification-unread-count' %}" hx-swap="outerHTML"></span>
        </div>
      </button>

      <div id="sidebar-tray-dropdown" 
           x-show="openTray" 
           @click.away="openTray = false" 
           x-cloak 
           class="tray-popup-sidebar">
      </div>
    </div>

    <button type="button" @click="toggleTheme()" class="btn btn-secondary w-full text-xs">
      Toggle Light / Dark
    </button>
  </div>
</aside>

<div class="relative" x-data="notificationTray">
  <button @click="toggleTray()"
          hx-get="{% url 'notification-tray' %}" 
          hx-target="#tray-dropdown"
          class="flex items-center justify-between w-full px-3 py-2 rounded-lg text-sm font-medium hover:bg-stone-100" 
          style="color: var(--text);">
    <div class="flex items-center gap-2">
      <span>🔔 Alerts</span>
      <span id="notif-badge" hx-get="{% url 'notification-unread-count' %}" hx-trigger="load" hx-swap="outerHTML"></span>
    </div>
  </button>

  <div id="tray-dropdown" 
       x-show="openTray" 
       @click.away="closeTray()"
       x-cloak 
       class="absolute left-0 bottom-12 w-64 card shadow-xl z-50 p-0 overflow-hidden">
  </div>
</div>
{% endif %}
