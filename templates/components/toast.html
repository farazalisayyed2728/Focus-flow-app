<div x-data="toastNotifications"
     @show-toast.window="addToast($event.detail.message, $event.detail.type)"
     class="fixed bottom-20 md:bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none">
  <template x-for="toast in toasts" :key="toast.id">
    <div class="card pointer-events-auto shadow-md text-sm py-2 px-4 transition-all"
         :class="toast.type === 'error' ? 'toast-error' : 'toast-success'">
      <span x-text="toast.message"></span>
    </div>
  </template>
</div>
