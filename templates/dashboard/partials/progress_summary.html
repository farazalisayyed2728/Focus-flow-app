<div id="progress-summary-card" class="card flex flex-col justify-between" hx-swap-oob="true">
    <div>
        <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--text-muted);">Today's Progress</span>
            <span class="text-base font-extrabold" style="color: var(--accent);">{{ completion_pct }}%</span>
        </div>
        
        <!-- Sunken Track with Raised Accent Bar -->
        <div class="neu-sunken p-1 rounded-full mb-3">
            <div class="h-3 rounded-full transition-all duration-300" 
                 style="background: var(--accent); width: {{ completion_pct }}%;"></div>
        </div>
    </div>

    <div class="flex justify-between text-xs font-semibold" style="color: var(--text-muted);">
        <span>Done: {{ completed_minutes }}m</span>
        <span>Planned: {{ planned_minutes }}m</span>
    </div>
</div>
