<div id="habit-card-{{ habit.id }}" class="card flex flex-col justify-between gap-4 {% if habit.is_paused %}opacity-60 bg-stone-50/50{% endif %}">
    <div class="flex items-start justify-between">
        <div>
            <div class="flex items-center gap-2">
                <h3 class="font-bold text-base">{{ habit.name }}</h3>
                <span class="pill text-xs">{{ habit.category }}</span>
                {% if habit.is_paused %}
                    <span class="pill text-xs">Paused</span>
                {% endif %}
            </div>
            {% if habit.description %}
                <p class="text-xs text-stone-500 mt-1">{{ habit.description }}</p>
            {% endif %}
        </div>

        <!-- Quick Check Circle -->
        <button hx-post="{% url 'habit-toggle' habit.id %}"
                hx-target="#habit-card-{{ habit.id }}"
                hx-swap="outerHTML"
                class="w-8 h-8 rounded-full flex items-center justify-center border transition-colors cursor-pointer"
                style="{% if today_completed %}background-color: var(--accent); border-color: var(--accent); color: white;{% else %}border-color: var(--border);{% endif %}"
                title="Mark completed for today">
            {% if today_completed %}✓{% endif %}
        </button>
    </div>

    <!-- Streak & Past 7 Days View -->
    <div class="flex items-center justify-between pt-2 border-t" style="border-color: var(--border);">
        <div class="flex items-center gap-1.5 text-xs">
            <span class="font-bold text-orange-600">🔥 {{ streak }}</span>
            <span style="color: var(--text-muted);">day streak</span>
        </div>

        <!-- 7-day indicators -->
        <div class="flex items-center gap-1.5">
            {% for d in history %}
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-stone-400 mb-0.5">{{ d.day_name }}</span>
                    <span class="w-3 h-3 rounded-full {% if d.status == 'completed' %}bg-orange-500{% else %}bg-stone-200{% endif %} {% if d.is_today %}ring-1 ring-orange-500 ring-offset-1{% endif %}"></span>
                </div>
            {% endfor %}
        </div>
    </div>

    <!-- Actions (Pause / Archive) -->
    <div class="flex justify-end gap-2 text-xs">
        <button hx-post="{% url 'habit-pause' habit.id %}"
                hx-target="#habit-card-{{ habit.id }}"
                hx-swap="outerHTML"
                class="text-stone-500 hover:text-stone-800">
            {% if habit.is_paused %}Resume{% else %}Pause{% endif %}
        </button>
        <button hx-post="{% url 'habit-archive' habit.id %}"
                hx-target="#habit-card-{{ habit.id }}"
                hx-swap="outerHTML"
                hx-confirm="Archive this habit? History will be preserved."
                class="text-red-500 hover:text-red-700">
            Archive
        </button>
    </div>
</div>
