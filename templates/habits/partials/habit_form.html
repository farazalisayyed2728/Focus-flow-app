<form hx-post="{% url 'habit-create' %}"
      hx-target="#habit-grid"
      hx-swap="beforeend"
      @htmx:after-request="if($event.detail.successful) { $dispatch('close-habit-modal'); }"
      style="display: flex; flex-direction: column; gap: 1.15rem;">
    {% csrf_token %}
    
    <div>
        <label style="display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.35rem;">Habit Name</label>
        {{ form.name }}
        {% if form.name.errors %}<p style="font-size: 0.72rem; color: #ef4444; margin-top: 0.25rem;">{{ form.name.errors.0 }}</p>{% endif %}
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div>
            <label style="display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.35rem;">Category</label>
            {{ form.category }}
        </div>
        <div>
            <label style="display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.35rem;">Frequency</label>
            {{ form.frequency_type }}
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div>
            <label style="display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.35rem;">Target Value</label>
            {{ form.target_value }}
        </div>
        <div>
            <label style="display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.35rem;">Unit</label>
            {{ form.unit }}
        </div>
    </div>

    <div>
        <label style="display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.35rem;">Description (Optional)</label>
        {{ form.description }}
    </div>

    <!-- Action Buttons -->
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 0.75rem; margin-top: 0.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
        <button type="button" @click="$dispatch('close-habit-modal')" class="action-secondary-btn" style="cursor: pointer;">
            Cancel
        </button>
        <button type="submit" class="action-pill-btn" style="cursor: pointer;">
            Create Habit
        </button>
    </div>
</form>
