<div id="block-row-{{ block.id }}" class="clean-card" style="display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.25rem; {% if is_overlap %}border: 2px solid #eab308;{% endif %}">
    <div style="display: flex; align-items: center; gap: 1rem; min-width: 0;">
        <!-- Time Badge -->
        <div class="neu-sunken" style="text-align: center; padding: 0.35rem 0.65rem; min-width: 70px; border-radius: var(--radius-sm); shrink-0;">
            <span style="font-size: 0.825rem; font-weight: 800; display: block; color: var(--text-main);">{{ block.start_time|time:"H:i" }}</span>
            <span style="font-size: 0.7rem; color: var(--text-subtle); display: block;">{{ block.end_time|time:"H:i" }}</span>
        </div>

        <!-- Block Details -->
        <div style="min-width: 0;">
            <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                <h3 style="font-size: 0.95rem; font-weight: 800; color: var(--text-main); margin: 0;">{{ block.title }}</h3>
                <span class="metric-delta-tag" style="font-size: 0.65rem; padding: 0.15rem 0.5rem;">{{ block.category }}</span>
                {% if is_overlap %}
                    <span style="font-size: 0.65rem; background: #fef08a; color: #854d0e; padding: 0.15rem 0.45rem; border-radius: var(--radius-full); font-weight: 700;">⚠️ Overlap</span>
                {% endif %}
            </div>
            {% if block.notes %}
                <p style="font-size: 0.775rem; color: var(--text-muted); margin-top: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ block.notes }}</p>
            {% endif %}
        </div>
    </div>

    <!-- Actions (Edit, Duplicate, Delete) -->
    <div style="display: flex; align-items: center; gap: 0.5rem; shrink-0;">
        <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-subtle); margin-right: 0.25rem;">{{ block.duration_minutes }}m</span>

        <button type="button"
                hx-get="{% url 'routine-block-update' block.id %}"
                hx-target="#modal-body"
                @click="openModal = true"
                class="action-secondary-btn" style="padding: 0.3rem 0.75rem; font-size: 0.72rem;">
            Edit
        </button>

        <button type="button"
                hx-post="{% url 'routine-block-duplicate' block.id %}"
                hx-target="#block-list"
                hx-swap="beforeend"
                class="action-secondary-btn" style="padding: 0.3rem 0.75rem; font-size: 0.72rem;">
            Duplicate
        </button>

        <button type="button"
                hx-post="{% url 'routine-block-delete' block.id %}"
                hx-target="#block-row-{{ block.id }}"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete this block?"
                class="action-secondary-btn" style="padding: 0.3rem 0.6rem; font-size: 0.72rem; color: #ef4444;">
            ✕
        </button>
    </div>
</div>
